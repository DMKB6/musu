
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Video Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 55px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #252525;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    color: white;
}

.logo span {
    color: #ff3040;
}

.header-right {
    color: #aaa;
    font-size: 13px;
}

.feed {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 12px 10px;
}

.video-card {
    width: 100%;
    height: min(78vh, 720px);
    min-height: 400px;
    background: #151515;
    position: relative;
    margin-bottom: 20px;
    border-radius: 13px;
    overflow: hidden;
    border: 1px solid #292929;
}

.player {
    width: 100%;
    height: 100%;
    background: black;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.video-info {
    position: absolute;
    left: 14px;
    bottom: 18px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 1px 5px black;
}

.video-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 6px;
}

.video-desc {
    font-size: 12px;
    color: #ddd;
}

.side-buttons {
    position: absolute;
    right: 12px;
    bottom: 70px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
}

.action-btn {
    border: none;
    background: rgba(0,0,0,0.7);
    color: white;
    width: 43px;
    height: 43px;
    border-radius: 50%;
    font-size: 19px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.action-btn:hover {
    background: #ff3040;
}

.sound-label {
    font-size: 10px;
    text-align: center;
    color: white;
}

.fullscreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    z-index: 9999;
    border-radius: 0;
    margin: 0;
}

.fullscreen .player {
    width: 100%;
    height: 100%;
}

@media(max-width:600px) {
    header {
        height: 48px;
    }

    .feed {
        padding: 5px;
    }

    .video-card {
        height: 76vh;
        min-height: 350px;
        border-radius: 8px;
        margin-bottom: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MY<span> REELS</span></div>
    <div class="header-right">Video Collection</div>
</header>

<div class="feed" id="feed">

    <!-- VIDEO 1 -->
    <div class="video-card">
        <div class="player" data-video="B6btl5hsTpc"></div>

        <div class="video-info">
            <div class="video-title">Video Number 01</div>
            <div class="video-desc">Enjoy this video ❤️</div>
        </div>

        <div class="side-buttons">
            <button class="action-btn sound-btn" onclick="toggleSound(this)">🔇</button>
            <div class="sound-label">Sound</div>
            <button class="action-btn" onclick="toggleFullscreen(this)">⛶</button>
            <div class="sound-label">Full Screen</div>
        </div>
    </div>

    <!-- VIDEO 2 -->
    <div class="video-card">
        <div class="player" data-video="6FzgXC5b6Gw"></div>

        <div class="video-info">
            <div class="video-title">Video Number 02</div>
            <div class="video-desc">Enjoy this video ❤️</div>
        </div>

        <div class="side-buttons">
            <button class="action-btn sound-btn" onclick="toggleSound(this)">🔇</button>
            <div class="sound-label">Sound</div>
            <button class="action-btn" onclick="toggleFullscreen(this)">⛶</button>
            <div class="sound-label">Full Screen</div>
        </div>
    </div>

    <!-- VIDEO 3 -->
    <div class="video-card">
        <div class="player" data-video="ysz5S6PUM-U"></div>

        <div class="video-info">
            <div class="video-title">Video Number 03</div>
            <div class="video-desc">Enjoy this video ❤️</div>
        </div>

        <div class="side-buttons">
            <button class="action-btn sound-btn" onclick="toggleSound(this)">🔇</button>
            <div class="sound-label">Sound</div>
            <button class="action-btn" onclick="toggleFullscreen(this)">⛶</button>
            <div class="sound-label">Full Screen</div>
        </div>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let players = [];
let activePlayer = null;
let soundEnabled = false;

// YouTube API Ready
function onYouTubeIframeAPIReady() {

    const containers = document.querySelectorAll('.player');

    containers.forEach((container, index) => {

        const videoId = container.dataset.video;

        const player = new YT.Player(container, {
            videoId: videoId,

            playerVars: {
                autoplay: 0,
                controls: 1,
                mute: 1,
                playsinline: 1,
                rel: 0,
                enablejsapi: 1
            },

            events: {
                onReady: function(event) {
                    event.target.mute();
                    event.target.setVolume(100);
                }
            }
        });

        players.push({
            player: player,
            card: container.closest('.video-card')
        });

    });

    startAutoPlay();
}


// Scroll করলে ভিডিও চালু/বন্ধ
function startAutoPlay() {

    const observer = new IntersectionObserver((entries) => {

        entries.forEach(entry => {

            const item = players.find(
                p => p.card === entry.target
            );

            if (!item) return;

            if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {

                // অন্য ভিডিও বন্ধ
                players.forEach(p => {
                    if (p !== item) {
                        try {
                            p.player.pauseVideo();
                        } catch(e) {}
                    }
                });

                activePlayer = item.player;

                try {
                    if (soundEnabled) {
                        item.player.unMute();
                        item.player.setVolume(100);
                    } else {
                        item.player.mute();
                    }

                    item.player.playVideo();

                } catch(e) {}

            } else {

                try {
                    item.player.pauseVideo();
                } catch(e) {}

            }

        });

    }, {
        threshold: [0, 0.65, 0.85]
    });

    document.querySelectorAll('.video-card').forEach(card => {
        observer.observe(card);
    });
}


// Sound ON/OFF
function toggleSound(button) {

    const card = button.closest('.video-card');

    const item = players.find(p => p.card === card);

    if (!item) return;

    soundEnabled = !soundEnabled;

    // সব ভিডিওর সাউন্ড নিয়ন্ত্রণ
    players.forEach(p => {

        if (soundEnabled) {
            p.player.mute();
        } else {
            p.player.mute();
        }

    });

    if (soundEnabled) {

        item.player.unMute();
        item.player.setVolume(100);
        item.player.playVideo();

        button.innerHTML = "🔊";

    } else {

        item.player.mute();
        button.innerHTML = "🔇";

    }

    // অন্য Sound Button আপডেট
    document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.innerHTML = soundEnabled ? "🔊" : "🔇";
    });

}


// Fullscreen
function toggleFullscreen(button) {

    const card = button.closest('.video-card');

    if (!document.fullscreenElement) {

        if (card.requestFullscreen) {
            card.requestFullscreen();
        } else if (card.webkitRequestFullscreen) {
            card.webkitRequestFullscreen();
        }

    } else {

        if (document.exitFullscreen) {
            document.exitFullscreen();
        }

    }
}

</script>

</body>
</html>
