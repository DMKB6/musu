
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>My Video Reels</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080812;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #101020;
    padding: 16px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    border-bottom: 1px solid #292940;
}

.sound-info {
    text-align: center;
    padding: 12px;
    color: #bbb;
    font-size: 13px;
}

#soundBtn {
    display: block;
    margin: 5px auto 15px;
    padding: 12px 24px;
    border: none;
    border-radius: 30px;
    background: #7c4dff;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.feed {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 10px;
}

.reel {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 80vh;
    margin-bottom: 25px;
    background: #151525;
    border-radius: 16px;
    overflow: hidden;
}

.reel iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.reel-label {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    background: rgba(0,0,0,.65);
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    pointer-events: none;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>🎬 My Video Reels</header>

<div class="sound-info">
    প্রথমবার সাউন্ড চালু করতে নিচের বাটনে ক্লিক করো।
</div>

<button id="soundBtn">🔊 Enable Sound</button>

<div class="feed" id="feed">

    <!-- Video 1 -->
 <div class="reel" data-video="B6btl5hsTpc">
    <div class="reel-label">Video 01</div>
    <div class="player"></div>
</div>

    <!-- Video 2 -->
    <div class="reel" data-video="VIDEO_ID_2">
        <div class="reel-label">Video 02</div>
        <div class="player"></div>
    </div>

    <!-- Video 3 -->
    <div class="reel" data-video="VIDEO_ID_3">
        <div class="reel-label">Video 03</div>
        <div class="player"></div>
    </div>

</div>

<footer>
    © 2026 My Video Reels
</footer>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let players = [];
let soundEnabled = false;
let activePlayer = null;
let apiReady = false;

const reels = document.querySelectorAll(".reel");
const soundBtn = document.getElementById("soundBtn");

function onYouTubeIframeAPIReady() {
    apiReady = true;
    createPlayers();
}

function createPlayers() {

    reels.forEach((reel, index) => {

        const videoId = reel.dataset.video;

        if (!videoId || videoId.startsWith("VIDEO_ID")) return;

        const player = new YT.Player(
            document.createElement("div"),
            {
                videoId: videoId,

                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    playsinline: 1,
                    rel: 0,
                    enablejsapi: 1,
                    origin: location.origin
                },

                events: {
                    onReady: function(event) {
                        players[index] = event.target;

                        reel.querySelector(".player")
                            .appendChild(event.target.getIframe());
                    },

                    onStateChange: function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            players.forEach((p, i) => {
                                if (p && p !== event.target) {
                                    p.pauseVideo();
                                }
                            });
                        }
                    }
                }
            }
        );
    });
}

const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        if (!entry.isIntersecting) return;

        const index = [...reels].indexOf(entry.target);
        const player = players[index];

        if (!player || !player.playVideo) return;

        if (activePlayer && activePlayer !== player) {
            activePlayer.pauseVideo();
        }

        activePlayer = player;

        player.playVideo();

        if (!soundEnabled) {
            player.mute();
        } else {
            player.unMute();
            player.setVolume(100);
        }

    });

}, {
    threshold: 0.65
});

reels.forEach(reel => observer.observe(reel));

soundBtn.addEventListener("click", () => {

    soundEnabled = true;

    soundBtn.innerText = "🔊 Sound Enabled";

    if (activePlayer) {
        activePlayer.unMute();
        activePlayer.setVolume(100);
        activePlayer.playVideo();
    }

});

document.addEventListener("visibilitychange", () => {

    if (document.hidden) {
        if (activePlayer) {
            activePlayer.pauseVideo();
        }
    }

});
</script>

</body>
</html>
